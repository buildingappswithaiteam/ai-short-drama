<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="alternate" type="application/atom+xml" title="AI Short Drama blog" href="{{ '/feed.xml' | relative_url }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <a class="visually-hidden-focusable skip-link" href="#main">Skip to content</a>
    <header class="site-header border-bottom">
      <nav class="container navbar navbar-expand-md" aria-label="Main navigation">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">AI Short Drama<span class="brand-period">.</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="main-nav">
          <ul class="navbar-nav ms-auto gap-md-3">
            <li class="nav-item"><a class="nav-link{% if page.url == '/series/' %} active{% endif %}" href="{{ '/series/' | relative_url }}">Directory</a></li>
            <li class="nav-item"><a class="nav-link{% if page.url == '/blog/' %} active{% endif %}" href="{{ '/blog/' | relative_url }}">Blog</a></li>
            <li class="nav-item"><a class="nav-link{% if page.url == '/about/' %} active{% endif %}" href="{{ '/about/' | relative_url }}">About</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main id="main" class="container page-content">
      {{ content }}
    </main>

    <footer class="site-footer border-top">
      <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
        <span>&copy; {{ 'now' | date: '%Y' }} AI Short Drama</span>
        <div class="d-flex gap-3"><a href="{{ '/about/' | relative_url }}">About</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a><a href="{{ '/sitemap.xml' | relative_url }}">Sitemap</a></div>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>

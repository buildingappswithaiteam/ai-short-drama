title: AI Short Drama
tagline: Find AI short dramas worth watching
description: An independent directory of dramas made with AI, with clear details, official watch links, and thoughtful reviews.
url: https://ai-short-drama.com
baseurl: ""
lang: en
timezone: Asia/Kolkata
markdown: kramdown
permalink: /blog/:title/
collections:
  dramas:
    output: true
    permalink: /dramas/:name/
defaults:
  - scope:
      path: ""
      type: dramas
    values:
      layout: drama
  - scope:
      path: ""
      type: posts
    values:
      layout: post
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
